<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantab gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- GLOBALNA PUŁAPKA AUTOFILL -->
<input 
  type="text" 
  autocomplete="username"
  style="opacity:0; height:0; position:absolute; pointer-events:none;"
>

<!-- SEARCH BOX -->
<div class="search-container">
  <span class="search-icon">🔍</span>

  <input 
    type="text" 
    id="searchInput" 
    placeholder="Search..." 
    autocomplete="off"
    name="search-no-autofill"
    inputmode="search"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
  >
</div>

     <!-- PANEL FILTRÓW -->
  <section id="filters">
    <h2>Filters</h2>

    <div id="filtersGrid">

      <details class="filterBox">
        <summary>Tab color</summary>
        <div id="filterTabColor"></div>
      </details>

      <details class="filterBox">
        <summary>Tab type</summary>
        <div id="filterTabType"></div>
      </details>
      
      <details class="filterBox">
  <summary>Tab hole</summary>
  <div id="filterTabHole"></div>
</details>

<details class="filterBox">
  <summary>Tab only</summary>
  <div>
    <label>
      <input type="checkbox" id="filterTabOnly">
      Only tabs (no lids)
    </label>
  </div>
</details>

      
      <details class="filterBox">
        <summary>Lid color</summary>
        <div id="filterLidColor"></div>
      </details>

      <details class="filterBox">
        <summary>Lid size</summary>
        <div id="filterLidSize"></div>
      </details>

          <details class="filterBox">
        <summary>Country</summary>
        <div id="filterCountry"></div>
      </details>
<details class="filterBox">
  <summary>Status</summary>
  <div id="filterStatus"></div>
</details>
      
    </div>
  </section>

  <!-- GALERIA -->
  <h2 id="galleryTitle">Cantab gallery</h2>
  <section id="gallery"></section>

  <!-- STATYSTYKI NA DOLE -->
  <section id="statsPanel"></section>

<div id="lightbox" class="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>

<script src="script.js"></script>
</body>
</html>
